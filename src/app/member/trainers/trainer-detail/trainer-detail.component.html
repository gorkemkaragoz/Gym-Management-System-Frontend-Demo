<div class="detail-container">
  <div class="trainer-card-detailed">
    <div class="image-section">
      <img 
        [src]="trainer?.photoUrl || 'assets/blank-image/blank_profile.png'" 
        alt="Trainer Photo" 
        class="profile-img"
      />
    </div>

    <div class="info-section">
      <h2 class="section-title">About the Trainer</h2>
      <div class="info-grid">
        <div class="info-item">
          <span class="label">Name:</span>
          <span class="value">{{ trainer?.firstName }} {{ trainer?.lastName }}</span>
        </div>
        <div class="info-item">
          <span class="label">Email:</span>
          <span class="value">{{ trainer?.email }}</span>
        </div>
        <div class="info-item">
          <span class="label">Certificate:</span>
          <span class="value">{{ trainer?.certificateName || 'N/A' }}</span>
        </div>
        <div class="info-item">
          <span class="label">Issued By:</span>
          <span class="value">{{ trainer?.issuedBy || 'N/A' }}</span>
        </div>
        <div class="info-item">
          <span class="label">Issued Date:</span>
          <span class="value">{{ trainer?.issuedDate | date:'longDate' }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
