<!-- src/app/auth/change-password/change-password.component.html -->
<div class="breadcrumb" *ngIf="!isLoggedIn()">
  <a routerLink="/login">Login</a> &gt;
  <a routerLink="/login/forgot-password">Forgot my password</a> &gt;
  <span>Change Password</span>
</div>

<div class="change-password-page">
  <h2>Change Your Password</h2>

  <form
    class="change-password-form"
    (ngSubmit)="onSubmit()"
    #changePasswordForm="ngForm"
  >
    <div class="form-group">
      <label for="currentPassword">Current Password</label>
      <input
        type="password"
        id="currentPassword"
        name="currentPassword"
        placeholder="Enter your current password"
        [(ngModel)]="changePasswordData.currentPassword"
        required
      />
    </div>

    <div class="form-group">
      <label for="newPassword">New Password</label>
      <input
        type="password"
        id="newPassword"
        name="newPassword"
        placeholder="Enter your new password"
        [(ngModel)]="changePasswordData.newPassword"
        required
        minlength="6"
      />
    </div>

    <button type="submit" class="btn-change" [disabled]="!changePasswordForm.form.valid">
      Update Password
    </button>

    <div *ngIf="successMessage" class="success-message">
      {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>
  </form>
</div>
