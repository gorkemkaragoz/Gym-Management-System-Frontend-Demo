<!-- src/app/auth/forgot-password/forgot-password.component.html -->
<nav class="breadcrumb">
  <a routerLink="/login">Login</a> &gt;
  <span>Forgot my password</span>
</nav>

<div class="login-page">
  <h2>Enter your TCKN and Email</h2>
  <form class="login-form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="tckn">TCKN</label>
      <input
        id="tckn" name="tckn"
        type="text"
        placeholder="TCKN"
        [(ngModel)]="model.tckn"
        required
      />
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input
        id="email" name="email"
        type="email"
        placeholder="Email"
        [(ngModel)]="model.email"
        required
      />
    </div>

    <button type="submit" class="btn-login">
      Forgot My Password
    </button>
  </form>
</div>
